<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>HireZero promo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05080f}
body{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#f4f7fc;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#05080f}
.abs{position:absolute}
.scene{position:absolute;inset:0;display:none}
/* atmosphere */
#bg{position:absolute;inset:-10%;}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:96px 96px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 80%)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,#000a 100%);pointer-events:none}
.floor{position:absolute;left:-60%;width:220%;bottom:-120px;height:620px;background-image:linear-gradient(#4d86ff44 2px,transparent 2px),linear-gradient(90deg,#4d86ff44 2px,transparent 2px);background-size:120px 120px;transform:perspective(700px) rotateX(72deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
/* type */
.kicker{font:600 22px/1 "Cascadia Mono",Consolas,monospace;letter-spacing:.22em;color:#6f9bff;text-transform:uppercase}
.h{font-weight:700;font-size:88px;line-height:1.02;letter-spacing:-.035em}
.sub{font-size:31px;line-height:1.35;color:#9fb0c9;font-weight:400}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .12em;margin-bottom:-.12em}
.w{display:inline-block;will-change:transform}
.blue{color:#6f9bff}
/* product surfaces (light, like the app) */
.card{position:absolute;background:#fff;color:#1b1d23;border-radius:18px;box-shadow:0 40px 120px #0008,0 0 0 1px #ffffff14;font-family:"Segoe UI",system-ui,sans-serif}
.win{position:absolute;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 50px 140px #000b,0 0 0 1px #ffffff1c}
.win .bar{position:absolute;left:0;right:0;top:0;height:40px;background:#f3f5f9;border-bottom:1px solid #e1e5ec;display:flex;align-items:center;gap:8px;padding:0 18px;z-index:3}
.win .bar i{width:11px;height:11px;border-radius:50%;background:#d2d7e0}
.win .bar span{font:500 14px "Segoe UI";color:#8490a3;margin-left:14px}
.win .view{position:absolute;left:0;right:0;top:40px;bottom:0;overflow:hidden}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world img{display:block}
.hl{position:absolute;border-radius:14px;background:#245ddb18;box-shadow:inset 0 0 0 4px #245ddb;}
.ring{position:absolute;border-radius:16px;box-shadow:0 0 0 5px #3b7bff,0 0 40px 10px #3b7bff66}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600}
.avatar{border-radius:14px;background:url(assets/cockpit-phone.png) no-repeat;background-color:#eef0f4}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:12px;background:#f1f3f7;border:1px solid #e1e5ec;font:600 21px "Segoe UI";color:#4b5568}
.feed-row{position:absolute;left:36px;right:36px;height:78px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #edf0f4}
.feed-row .ic{width:46px;height:46px;border-radius:12px;background:#eef3ff;display:flex;align-items:center;justify-content:center;flex:none}
.feed-row b{font:600 23px "Segoe UI";color:#1b1d23}
.feed-row small{margin-left:auto;font:500 17px "Segoe UI";color:#98a2b3}
.res-row{position:absolute;left:34px;right:34px;height:60px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #eef1f5}
.res-row .t{font:600 21px "Segoe UI";color:#1b1d23;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
.tag{font:600 15px "Segoe UI";color:#5b6679;background:#f1f3f7;border-radius:8px;padding:4px 10px}
.grade{margin-left:auto;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 21px "Segoe UI";flex:none}
.g-a{background:#e5f6ec;color:#177a43}.g-b{background:#fdf2dc;color:#9a6200}
.post{position:absolute;width:232px;height:318px;top:0;background:#fff;border-radius:18px;color:#1b1d23;box-shadow:0 30px 80px #0009;padding:22px;font-family:"Segoe UI"}
.post .ln{height:12px;border-radius:6px;background:#e7eaf0;margin-top:12px}
.post .st{position:absolute;left:22px;bottom:22px;right:22px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 18px "Segoe UI"}
.phone{position:absolute;width:372px;height:790px;border-radius:58px;background:#0d1119;padding:16px;box-shadow:0 50px 120px #000c,inset 0 0 0 2px #2b3342}
.phone .scr{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff;position:relative}
.phone .scr img{width:340px;display:block}
.phone .notch{position:absolute;left:50%;top:26px;width:110px;height:30px;margin-left:-55px;border-radius:20px;background:#0d1119;z-index:2}
.cursor{position:absolute;left:0;top:0;width:46px;height:46px;z-index:50;filter:drop-shadow(0 6px 10px #0008)}
.ripple{position:absolute;border-radius:50%;border:3px solid #fff;z-index:49}
#tagline{position:absolute;left:64px;bottom:40px;font:500 17px "Segoe UI";color:#7d8aa0;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
#tagline i{width:7px;height:7px;border-radius:50%;background:#3b7bff;display:inline-block}
#brand{position:absolute;left:64px;top:44px;display:flex;align-items:center;gap:14px;font:700 26px "Segoe UI Variable Display";letter-spacing:-.02em}
#brand svg{width:40px;height:40px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:95}
</style>
<body>
<div id="stage">
  <div id="bg"><div class="blob" id="b1" style="width:900px;height:900px;background:#1d4ed8"></div><div class="blob" id="b2" style="width:800px;height:800px;background:#4338ca"></div><div class="blob" id="b3" style="width:700px;height:700px;background:#0e7490"></div></div>
  <div id="grid"></div>
  <div class="floor" id="floor"></div>
  <div id="scenes"></div>
  <div id="brand"></div>
  <div id="tagline"><i></i><span>Product UI · sample workspace</span></div>
  <div id="vignette"></div>
  <div id="flash"></div><div id="black"></div>
</div>
<script>
const TL=/*TIMELINE*/{};
const {BEAT,DURATION}=TL;
// ---------------- tiny deterministic motion kit ----------------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const L=(a,b,x)=>a+(b-a)*x;
const E={out3:x=>1-(1-x)**3,out5:x=>1-(1-x)**5,in3:x=>x**3,io3:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  outBack:x=>{const c=1.6;return 1+(c+1)*(x-1)**3+c*(x-1)**2},outExpo:x=>x>=1?1:1-2**(-10*x),inExpo:x=>x<=0?0:2**(10*x-10),
  ioExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2};
const H=html=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;};
const css=(el,o)=>{for(const k in o)el.style[k]=o[k];};
const words=(text,cls='')=>(/^\s/.test(text)?' ':'')+text.split(/(\n)/).map(part=>part==='\n'?'<br>':part.split(' ').filter(Boolean).map(w=>`<span class="wm"><span class="w ${cls}">${w}</span></span>`).join(' ')).join('')+(/\S\s$/.test(text)?' ':'');
// Staggered word rise; returns nothing, just poses every .w inside el for time t.
function rise(el,t,t0,{stagger=.045,dur=.6,out=null,outDur=.25}={}){
  el.querySelectorAll('.w').forEach((w,i)=>{
    const x=E.outExpo(P(t,t0+i*stagger,t0+i*stagger+dur));let y=L(110,0,x),o=1;
    if(out!==null){const q=E.in3(P(t,out,out+outDur));y+=-110*q;o=1-q;}
    css(w,{transform:`translateY(${y}%)`,opacity:o});
  });
}
// Whole-element enter/exit: fade + move + blur.
function pose(el,t,a,b,{dx=0,dy=40,s=1,blur=10,inDur=.6,outDur=.35,outDx=0,outDy=-40,outS=1,ease=E.outExpo}={}){
  const i=ease(P(t,a,a+inDur)),o=b==null?0:E.in3(P(t,b-outDur,b));
  const x=L(dx,0,i)+outDx*o,y=L(dy,0,i)+outDy*o,sc=L(s,1,i)*L(1,outS,o),op=i*(1-o),bl=blur*(1-i)+blur*o;
  css(el,{opacity:op,transform:`translate(${x}px,${y}px) scale(${sc})`,filter:bl>.05?`blur(${bl}px)`:'none'});
}
// Keyframed values: frames=[[t,{k:v}],...], eased per segment.
function keys(t,frames,ease=E.io3){
  if(t<=frames[0][0])return frames[0][1];
  for(let i=1;i<frames.length;i++)if(t<=frames[i][0]){const [ta,a]=frames[i-1],[tb,b]=frames[i],x=ease(P(t,ta,tb)),o={};for(const k in b)o[k]=L(a[k],b[k],x);return o;}
  return frames.at(-1)[1];
}
function camera(world,vw,vh,c){css(world,{transform:`translate(${vw/2-c.fx*c.s}px,${vh/2-c.fy*c.s}px) scale(${c.s})`});}
const MARK=`<svg viewBox="0 0 192 192"><rect width="192" height="192" rx="42" fill="#fff"/><g transform="translate(96 96) scale(6.4) translate(-12 -12)" fill="none" stroke="#0b1020" stroke-width="2.4"><path d="M4.3 6.5v11M9.8 6.5v11M4.3 12h5.5"/><rect x="12.9" y="6.5" width="6.8" height="11" rx="3.4"/><path d="M13.9 16.6l4.8-9.2"/></g></svg>`;
const ICON={
  globe:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#245ddb" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  wrench:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#245ddb" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0 5 5l-8.9 8.9a2.1 2.1 0 0 1-3-3z"/></svg>',
  search:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#245ddb" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  pen:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#245ddb" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  star:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#245ddb" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  doc:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#245ddb" stroke-width="2"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
  check:(c='#fff',s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
  bulb:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b7791f" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  play:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l12-7.5z"/></svg>',
};
const CURSOR='<svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.4 2.9 6.7 3-1.3-2.9-6.6h6.3z" fill="#fff" stroke="#0b1020" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const scenes=[];
const add=(a,b,html,update)=>{const el=H(html);document.getElementById('scenes').appendChild(el);scenes.push({a,b,el,update});return el;};
const q=(el,s)=>el.querySelector(s),qa=(el,s)=>[...el.querySelectorAll(s)];
function cursor(el,t,path,clickAt){ // path: [[t,x,y],...]
  const c=q(el,'.cursor'),r=q(el,'.ripple');const k=keys(t,path.map(([tt,x,y])=>[tt,{x,y}]),E.io3);
  const vis=P(t,path[0][0]-.15,path[0][0])*(clickAt!=null?1-P(t,clickAt+.5,clickAt+.8):1);const press=clickAt!=null&&t>=clickAt-.06&&t<clickAt+.12?0.82:1;
  css(c,{opacity:vis,transform:`translate(${k.x}px,${k.y}px) scale(${press})`});
  if(r){const x=P(t,clickAt,clickAt+.55);css(r,{opacity:t>=clickAt&&x<1?(1-x)*.9:0,left:k.x-10+'px',top:k.y-10+'px',width:'20px',height:'20px',transform:`scale(${1+E.out3(x)*5})`});}
}

// ================= 1. COLD OPEN (0–8) =================
{
  const lines=[
    [TL.COLD_HITS[0],'You built the product.'],
    [TL.COLD_HITS[1],'Now people need to <span class="blue">find it.</span>'],
    [TL.COLD_HITS[2],'<span class="box"></span> Marketing is still on your list.'],
  ];
  const html=`<div class="scene" id="cold">${lines.map((l,i)=>`<div class="abs line" style="left:0;right:0;top:470px;text-align:center" data-i="${i}"><div class="h" style="font-size:112px">${l[1].replace(/<span class="box"><\/span>/,'<span class="wm"><span class="w"><span class="cbox" style="display:inline-block;width:.72em;height:.72em;border:7px solid #6f9bff;border-radius:.14em;vertical-align:-.04em"></span></span></span>').replace(/(^|>)([^<]+)(?=<|$)/g,(m,a,txt)=>a+words(txt))}</div></div>`).join('')}
    ${['So','make','your next','hire.'].map((w,i)=>`<div class="abs stut" style="left:0;right:0;top:${i===3?330:390}px;text-align:center"><div class="h" style="font-size:${i===3?300:220}px;letter-spacing:-.05em">${w==='hire.'?'<span class="blue">hire.</span>':w}</div></div>`).join('')}
  </div>`;
  add(0,8.05,html,(t,el)=>{
    qa(el,'.line').forEach((ln,i)=>{const t0=lines[i][0],end=i<2?lines[i+1][0]-.12:TL.COLD_STUTTER[0]-.12;
      ln.style.display=t>=t0-.05&&t<end+.3?'block':'none';rise(ln,t,t0,{stagger:.06,dur:.7,out:end-.18,outDur:.22});
      const push=1+P(t,t0,end)*.04;ln.style.transform=`scale(${push})`;});
    const cb=q(el,'.cbox');if(cb){const s=P(t,TL.COLD_HITS[2]+.9,TL.COLD_HITS[2]+1.5);cb.style.transform=`rotate(${Math.sin(s*Math.PI*6)*8*(1-s)}deg)`;}
    qa(el,'.stut').forEach((s,i)=>{const t0=TL.COLD_STUTTER[i],t1=i<3?TL.COLD_STUTTER[i+1]:8;const on=t>=t0&&t<t1;s.style.display=on?'block':'none';
      if(!on)return;const x=E.outExpo(P(t,t0,t0+.3));let sc=L(1.35,1,x),bl=L(14,0,x);
      if(i===3){const z=E.inExpo(P(t,7.72,8));sc*=L(1,9,z);bl+=z*18;}
      css(s,{transform:`scale(${sc})`,filter:`blur(${bl}px)`,opacity:Math.min(1,x*1.4)});});
  });
}

// ================= 2. REVEAL (8–12) =================
{
  const el=add(8,12.05,`<div class="scene" id="reveal">
    <div class="abs ring0" style="left:960px;top:470px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:3px solid #6f9bff"></div>
    <div class="abs lock" style="left:0;right:0;top:380px;display:flex;justify-content:center;align-items:center;gap:44px">
      <div class="mk" style="width:190px;height:190px">${MARK}</div>
      <div class="wmk" style="overflow:hidden"><div class="h" style="font-size:176px;letter-spacing:-.05em;line-height:1.1;padding-bottom:10px">HireZero</div></div>
    </div>
    <div class="abs t1" style="left:0;right:0;top:640px;text-align:center"><div class="sub" style="font-size:48px;color:#dce5f5;font-weight:600">${words('Your AI marketing lead.')}</div></div>
    <div class="abs t2" style="left:0;right:0;top:720px;text-align:center"><div class="sub" style="font-size:38px">${words('It does the work. You make the call.')}</div></div>
  </div>`,(t,el)=>{
    const m=E.outExpo(P(t,8,8.55));css(q(el,'.mk'),{transform:`scale(${L(2.4,1,m)}) rotate(${L(-12,0,m)}deg)`,opacity:Math.min(1,m*3)});
    const w=E.outExpo(P(t,8.2,8.9)),wk=q(el,'.wmk');css(wk,{width:(w*wk.firstElementChild.scrollWidth)+'px',opacity:w});
    const r=P(t,8,9);css(q(el,'.ring0'),{transform:`scale(${.6+E.out3(r)*7})`,opacity:(1-r)*.7});
    rise(q(el,'.t1'),t,9);rise(q(el,'.t2'),t,10,{stagger:.06});
    const o=E.in3(P(t,11.55,12));css(el,{transform:`scale(${1+o*.18})`,opacity:1-o,filter:o>0?`blur(${o*12}px)`:'none'});
  });
  // the lock-up should sit centred as the word mask opens
}

// ================= 3. BRIEF (12–20) =================
{
  const rows=[1378,1477,1678,1778],labels=['What you sell','Who it’s for','Your voice','What you can honestly claim'];
  const el=add(11.9,20.05,`<div class="scene" id="brief">
    <div class="abs copy" style="left:110px;top:250px;width:640px">
      <div class="kicker">01 · Your business</div>
      <div class="h" style="margin-top:26px">${words('Brief it once.')}</div>
      <div class="sub" style="margin-top:24px">${words('Offer, audience, voice — and only the claims you can back up.')}</div>
      <div class="list" style="margin-top:46px">${labels.map(l=>`<div class="li" style="display:flex;align-items:center;gap:18px;height:66px;font:600 30px 'Segoe UI Variable Display'"><span class="ck" style="width:38px;height:38px;border-radius:50%;background:#245ddb;display:flex;align-items:center;justify-content:center">${ICON.check('#fff',22)}</span>${l}</div>`).join('')}</div>
    </div>
    <div class="win" style="left:800px;top:150px;width:1030px;height:790px"><div class="bar"><i></i><i></i><i></i><span>HireZero · Marketing agent · Business brief</span></div>
      <div class="view"><div class="world"><img src="assets/business-brief.png" width="2880" height="1920"><div class="hl" style="left:224px;width:1920px;height:98px"></div></div></div></div>
  </div>`,(t,el)=>{
    const copy=q(el,'.copy');rise(copy.children[1],t,12.15);rise(copy.children[2],t,12.6,{stagger:.03});
    pose(copy.children[0],t,12,20,{dy:20,outDur:.3,outDx:-120,outDy:0});
    css(copy,{opacity:1-E.in3(P(t,19.6,20)),transform:`translateX(${-160*E.in3(P(t,19.6,20))}px)`});
    qa(el,'.li').forEach((li,i)=>{const t0=14+i;const x=E.outBack(P(t,t0,t0+.45));css(li,{opacity:P(t,t0,t0+.15),transform:`translateX(${L(-40,0,E.outExpo(P(t,t0,t0+.5)))}px)`});css(li.firstElementChild,{transform:`scale(${x})`});});
    const win=q(el,'.win'),world=q(el,'.world');
    const e=E.outExpo(P(t,12,12.9)),x=E.in3(P(t,19.55,20));
    css(win,{opacity:e*(1-x),transform:`perspective(2400px) translateX(${L(260,0,e)-900*x}px) rotateY(${L(-24,-9,e)}deg) rotateX(3deg) scale(${L(.92,1,e)})`,filter:x>0?`blur(${x*16}px)`:'none'});
    const c=keys(t,[[12,{fx:1440,fy:960,s:.357}],[13.4,{fx:1440,fy:960,s:.38}],[14.3,{fx:930,fy:1460,s:.6}],[16.2,{fx:930,fy:1560,s:.61}],[17.4,{fx:930,fy:1680,s:.62}],[20,{fx:930,fy:1700,s:.64}]]);
    camera(world,1030,750,c);
    let idx=-1;for(let i=0;i<4;i++)if(t>=14+i)idx=i;const hl=q(el,'.hl');
    if(idx<0)css(hl,{opacity:0});else{const from=idx?rows[idx-1]:rows[0],m=E.outExpo(P(t,14+idx,14+idx+.4));css(hl,{opacity:P(t,14,14.2),top:(L(from,rows[idx],idx?m:1)-49)+'px'});}
  });
}

// ================= 4. SHIFT (20–28) =================
{
  const chips=['Sense','Prioritize','Create','Align','Launch','Measure','Decide','Learn'];
  const feed=[['globe','Read hirezero.app — 6 pages checked','11:02 PM'],['wrench','Found 3 fixes worth making on the site','11:09 PM'],['search','Compared positioning with 2 competitors','11:31 PM'],['pen','Drafted a week of posts — 7 pieces','12:05 AM'],['star','Graded every piece against your brief','12:40 AM']];
  const el=add(19.8,28.05,`<div class="scene" id="shift">

    pose(B.children[0],t,sw+.05,60,{dy:16,outDur:.3});rise(B.children[1],t,sw+.1,{stagger:.05,out:59.6});

    const hl=q(el,'.teamwin .hl'),rg=q(el,'.teamwin .ring');css(hl,{opacity:P(t,57.6,57.9)});const rx=P(t,58.3,58.7);css(rg,{opacity:t>=58.3?Math.min(1,rx*3):0,transform:`scale(${L(1.8,1,E.outExpo(rx))})`});
  });
}

{

    rise(q(el,'.t1'),t,B+.7,{stagger:.06});
    const u=E.outBack(P(t,B+1.5,B+1.95));css(q(el,'.url'),{opacity:P(t,B+1.5,B+1.6),transform:`scale(${L(1.5,1,E.outExpo(P(t,B+1.5,B+1.9)))*Math.min(1,u*1.2)})`});
    css(q(el,'.oc'),{opacity:E.out3(P(t,B+2.2,B+3))});

window.seek=t=>{
  for(const s of scenes){const on=t>=s.a&&t<s.b;s.el.style.display=on?'block':'none';if(on)s.update(t,s.el);}
  // atmosphere drifts slowly; brighter after the reveal
  const lit=P(t,7.8,8.4)*(1-.5*P(t,38,39)*(1-P(t,43.6,44.2)));
  const bgo=L(.15,1,lit);
  css(document.getElementById('b1'),{left:(300+Math.sin(t*.21)*260)+'px',top:(80+Math.cos(t*.17)*140)+'px',opacity:.5*bgo});
  css(document.getElementById('b2'),{left:(1150+Math.cos(t*.19)*240)+'px',top:(420+Math.sin(t*.23)*160)+'px',opacity:.42*bgo});
  css(document.getElementById('b3'),{left:(700+Math.sin(t*.13+2)*300)+'px',top:(650+Math.cos(t*.15)*120)+'px',opacity:.3*bgo});
  document.getElementById('grid').style.opacity=L(.2,1,lit);
  const fl=document.getElementById('floor');const fOn=(t>=8&&t<12)||t>=62.5;fl.style.display=fOn?'block':'none';
  if(fOn){fl.style.backgroundPosition=`0 ${t*140}px`;fl.style.opacity=t<12?E.out3(P(t,8,8.8))*(1-P(t,11.5,12)):E.out3(P(t,62.5,63.5));}
  const ui=t>=12.2&&t<59.9;const uo=Math.min(P(t,12.2,12.8),1-P(t,59.4,59.9));
  css(document.getElementById('tagline'),{opacity:ui?uo:0});css(document.getElementById('brand'),{opacity:ui?uo:0});
  const flash=Math.max(t>=8?1-P(t,8,8.35):0,t>=44?.55*(1-P(t,44,44.3)):0,t>=62.5?.3*(1-P(t,62.5,62.8)):0);
  document.getElementById('flash').style.opacity=flash;
  document.getElementById('black').style.opacity=Math.max(E.io3(P(t,66.3,67.9)),1-P(t,0,.25));
  // gentle camera shake on the two drops
  const shake=(d,t0)=>t>=t0&&t<t0+.4?d*(1-P(t,t0,t0+.4)):0,sh=shake(10,8)+shake(12,44)+shake(5,62.5);
  document.getElementById('scenes').style.transform=sh?`translate(${Math.sin(t*93)*sh}px,${Math.cos(t*71)*sh}px)`:'none';
};
