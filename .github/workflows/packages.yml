name: Native portable packages
on:
  workflow_dispatch:
# No push/PR trigger: native hosted matrix runs require an explicit decision.
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/publish-portable.mjs ${{ matrix.rid }} ci
      - name: Native credential service prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 dbus dbus-x11 gnome-keyring libglib2.0-bin
      - name: Extracted host and credentials under a private Linux session
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/check-package-linux.sh
      - if: runner.os != 'Linux'
        run: node scripts/portable-check.mjs artifacts/portable-ci artifacts/portable-check-ci
      - if: runner.os == 'Windows'
        run: node scripts/credential-vault-check.mjs artifacts/portable-ci/thaddeus-win-x64/Thaddeus.Host.exe artifacts/credential-native-ci
      - if: runner.os == 'macOS'
        run: node scripts/credential-vault-check.mjs artifacts/portable-ci/thaddeus-${{ matrix.rid }}/Thaddeus.Host artifacts/credential-native-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence-${{ matrix.rid }}
          path: |
            artifacts/portable-check-ci/verified.json
            artifacts/portable-check-ci/*.log
            artifacts/portable-check-ci/generated-launcher/*
            artifacts/portable-ci/SHA256SUMS
            artifacts/credential-native-ci/verified.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: portable-${{ matrix.rid }}
          path: |
            artifacts/portable-ci/*.zip
            artifacts/portable-ci/*.tar.gz
            artifacts/portable-ci/SHA256SUMS
